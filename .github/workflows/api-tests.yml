name: API tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run tests with MockServer
        run: docker compose up --build --exit-code-from api-tests
      - name: Stop containers
        if: always()
        run: docker compose down
